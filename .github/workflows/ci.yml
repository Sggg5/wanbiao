name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: npm ci
      - name: Install asset tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Test
        run: npm test
      - name: Build and strict asset validation
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atelier-time-dist
          path: dist
          retention-days: 3
